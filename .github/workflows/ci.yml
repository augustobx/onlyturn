name: OnlyTurn CI

on:
  push:
    branches: [main, "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://onlyturn:ci_only@127.0.0.1:5432/onlyturn?schema=public
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Validate Hub integration scope in Compose (no database access)
        env:
          POSTGRES_PASSWORD: ci_only_secret
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AUTOMATION_CRON_SECRET: ci_only_automation
          CALENDAR_FEED_SECRET: ci_only_calendar
          HUB_INTEGRATION_TOKEN: ci_test_only_token_32_bytes_long_123456
          HUB_MANAGEMENT_ENABLED: "true"
          HUB_MANAGEMENT_TOKEN: ci_management_fixture_key_32_bytes_long_123456
        run: |
          docker compose -f docker-compose.yml config --format json > /tmp/onlyturn-compose.json
          python3 - <<'PY'
          import json
          services=json.load(open("/tmp/onlyturn-compose.json"))["services"]
          assert services["app"]["environment"].get("HUB_INTEGRATION_TOKEN") == "ci_test_only_token_32_bytes_long_123456"
          assert services["app"]["environment"].get("HUB_MANAGEMENT_TOKEN") == "ci_management_fixture_key_32_bytes_long_123456"
          for name in ("db","migrate","automation-worker"):
              assert "HUB_INTEGRATION_TOKEN" not in services[name].get("environment",{}), name
              assert "HUB_MANAGEMENT_TOKEN" not in services[name].get("environment",{}), name
              assert "HUB_MANAGEMENT_ENABLED" not in services[name].get("environment",{}), name
          assert not services["app"]["build"].get("args"), "No production secrets in build arguments"
          print("OnlyTurn integration token scoped to app; migrator and DB excluded")
          PY
      - run: npm run build

