name: onlyturn

services:
  db:
    image: postgres:17-alpine
    container_name: onlyturn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlyturn}
      POSTGRES_USER: ${POSTGRES_USER:-onlyturn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onlyturn} -d ${POSTGRES_DB:-onlyturn}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      target: migrator
      args:
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is required}
    container_name: onlyturn-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-onlyturn}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-onlyturn}?schema=public
      ONLYTURN_SUPERADMIN_EMAIL: ${ONLYTURN_SUPERADMIN_EMAIL:-}
      ONLYTURN_SUPERADMIN_PASSWORD: ${ONLYTURN_SUPERADMIN_PASSWORD:-}
      ONLYTURN_SUPERADMIN_NAME: ${ONLYTURN_SUPERADMIN_NAME:-NanoLabs Admin}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  app:
    build:
      context: .
      args:
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is required}
    container_name: onlyturn-web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-onlyturn}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-onlyturn}?schema=public
      APP_BASE_URL: ${APP_BASE_URL:-https://onlyturn.nanoapps.ar}
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-nanoapps.ar}
      PLATFORM_HOST: ${PLATFORM_HOST:-onlyturn.nanoapps.ar}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-nanoapps.ar}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is required}
      PAYMENT_ENCRYPTION_KEY: ${PAYMENT_ENCRYPTION_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - internal
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: onlyturn-postgres-data

networks:
  internal:
    name: onlyturn-internal
    internal: true
  proxy:
    name: proxy
    external: true
