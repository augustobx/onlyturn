name: onlyturn

services:
  db:
    image: postgres:17-alpine
    container_name: onlyturn-db
    environment:
      POSTGRES_DB: onlyturn
      POSTGRES_USER: onlyturn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onlyturn_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlyturn -d onlyturn"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      target: builder
    container_name: onlyturn-migrate
    command: sh scripts/deploy-migrate.sh
    environment:
      DATABASE_URL: postgresql://onlyturn:${POSTGRES_PASSWORD:-onlyturn_dev}@db:5432/onlyturn?schema=public
      ONLYTURN_SUPERADMIN_EMAIL: ${ONLYTURN_SUPERADMIN_EMAIL:-}
      ONLYTURN_SUPERADMIN_PASSWORD: ${ONLYTURN_SUPERADMIN_PASSWORD:-}
      ONLYTURN_SUPERADMIN_NAME: ${ONLYTURN_SUPERADMIN_NAME:-NanoLabs Admin}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  app:
    build: .
    container_name: onlyturn-web
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://onlyturn:${POSTGRES_PASSWORD:-onlyturn_dev}@db:5432/onlyturn?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-me}
      APP_BASE_URL: ${APP_BASE_URL:-https://onlyturn.nanoapps.ar}
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-nanoapps.ar}
      PLATFORM_HOST: ${PLATFORM_HOST:-onlyturn.nanoapps.ar}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-nanoapps.ar}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PAYMENT_ENCRYPTION_KEY: ${PAYMENT_ENCRYPTION_KEY:-local-payment-encryption-key-change-me}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: onlyturn-postgres-data

networks:
  internal:
    name: onlyturn-internal
    internal: true
  proxy:
    name: proxy
    external: true
